# Drop-in for prometheus-node-exporter.service on the Proxmox host.
# Enables the textfile collector consumed by jarvis-proxmox-vm-metrics.
# Install as:
#   /etc/systemd/system/prometheus-node-exporter.service.d/jarvis-textfile.conf
[Service]
ExecStart=
ExecStart=/usr/bin/prometheus-node-exporter --web.listen-address=192.168.1.5:9100 --collector.textfile.directory=/var/lib/node_exporter/textfile_collector
