# Relevant lines from the deployed CT116 configuration. Merge these into the
# Proxmox LXC configuration; this is not a complete container configuration.
hookscript: local:snippets/jarvis-ollama-gpu-passthrough-hook.sh
lxc.cgroup2.devices.allow: c 226:* rwm
lxc.cgroup2.devices.allow: c 509:* rwm
lxc.cgroup2.devices.allow: c 511:* rwm
lxc.mount.entry: /dev/kfd dev/kfd none bind,optional,create=file
lxc.mount.entry: /dev/dri/card1 dev/dri/card1 none bind,optional,create=file
lxc.mount.entry: /dev/dri/renderD129 dev/dri/renderD129 none bind,optional,create=file
