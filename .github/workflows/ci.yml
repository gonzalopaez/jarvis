name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: jarvis-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  core:
    name: Rust Core
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust components
        run: |
          rustup set profile minimal
          rustup toolchain install stable --component rustfmt --component clippy
          rustup default stable

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Test Core
        run: cargo test --locked -p jarvis-core --all-features

      - name: Lint Core
        run: cargo clippy --locked -p jarvis-core --all-features --all-targets -- -D warnings

  frontend:
    name: Desktop frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24.8.0
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Test frontend
        run: npm test

      - name: Build frontend
        run: npm run build

  mcp:
    name: MCP gateway
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: services/mcp-gateway
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Compile gateway
        run: python3 -m py_compile jarvis_mcp.py

      - name: Test allow-list enforcement
        run: python3 -m unittest -v

  security:
    name: Contracts and secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate JSON contracts
        run: |
          for schema in contracts/api/*.json contracts/events/*.json; do
            jq empty "$schema"
          done

      - name: Scan committed content for secrets
        run: bash scripts/secret-scan.sh
