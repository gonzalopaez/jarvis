[package]
name = "jarvis-core"
version = "0.1.0"
description = "Security and policy boundary for the JARVIS Core gateway"
edition = "2021"
publish = false

[features]
default = []
network-server = [
  "hyper/http1",
  "hyper/server",
  "hyper-util/tokio",
  "tokio/net",
]

[dependencies]
bytes = "1"
http = "1"
http-body = "1"
http-body-util = "0.1"
hyper = "1"
hyper-util = "0.1"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2"
tokio = { version = "1", features = ["macros", "rt", "time"] }
