[package]
name = "jarvis-core"
version = "0.1.0"
description = "Security and policy boundary for the JARVIS Core gateway"
edition = "2021"
publish = false

[features]
default = []
integration-tests = []
network-server = [
  "dep:futures-util",
  "dep:hyper-tungstenite",
  "hyper/http1",
  "hyper/server",
  "hyper-util/tokio",
  "tokio/net",
  "tokio/signal",
  "dep:reqwest",
  "dep:tokio-postgres",
]

[[bin]]
name = "jarvis-core"
path = "src/main.rs"
required-features = ["network-server"]

[dependencies]
bytes = "1"
http = "1"
http-body = "1"
http-body-util = "0.1"
hyper = "1"
hyper-util = "0.1"
futures-util = { version = "0.3", optional = true }
hyper-tungstenite = { version = "0.30", optional = true }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"], optional = true }
tokio-postgres = { version = "0.7", features = ["with-serde_json-1"], optional = true }
hex = "0.4"
getrandom = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2"
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }
